<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">

  <!-- Warm cream background circle -->
  <circle cx="140" cy="100" r="96" fill="#FBF5EE" stroke="#E8DDD0" stroke-width="1.5"/>

  <!-- ─── TAIL (bushy, curving upward from back of body) ─────── -->
  <path d="M 232 98 C 258 75 268 42 248 14 C 264 40 256 76 234 104 Z"
        fill="#CB9060"/>
  <path d="M 225 105 C 250 80 260 46 240 18 C 256 44 248 80 226 108 Z"
        fill="#D9A878"/>
  <!-- Tail tip curl -->
  <path d="M 248 14 C 238 8 228 14 234 24 C 238 30 248 26 248 14 Z"
        fill="#C48C58"/>

  <!-- ─── BODY ────────────────────────────────────────────────── -->
  <ellipse cx="182" cy="122" rx="58" ry="40" fill="#C8916A"/>

  <!-- ─── NECK ────────────────────────────────────────────────── -->
  <ellipse cx="127" cy="108" rx="28" ry="21" fill="#C8916A"/>

  <!-- ─── DIAGONAL BLACK STRIPE (tamanduá's characteristic band) -->
  <path d="M 148 84 C 162 83 186 94 216 162 L 194 162 C 165 100 148 90 130 86 Z"
        fill="#160C04"/>

  <!-- ─── HEAD ─────────────────────────────────────────────────── -->
  <ellipse cx="104" cy="104" rx="23" ry="18" fill="#C8916A"/>

  <!-- ─── SNOUT (long, tapered — the defining feature) ─────────── -->
  <!-- Top surface -->
  <path d="M 84 88 C 60 94 32 112 16 148 C 26 140 58 120 84 110 Z"
        fill="#C8916A"/>
  <!-- Underside (slightly darker) -->
  <path d="M 84 110 C 58 120 26 140 16 148 C 20 155 26 157 30 153
           C 50 141 74 126 86 116 Z"
        fill="#B07850"/>

  <!-- ─── FRONT LEG + LARGE CLAWS ──────────────────────────────── -->
  <rect x="138" y="158" width="12" height="26" rx="6" fill="#B07850"/>
  <path d="M 129 183 C 124 190 121 197 120 200" stroke="#7A4A28" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 138 185 C 137 192 136 198 135 200" stroke="#7A4A28" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 147 183 C 150 190 152 196 153 200" stroke="#7A4A28" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- ─── HIND LEG ──────────────────────────────────────────────── -->
  <rect x="205" y="158" width="12" height="21" rx="6" fill="#B07850"/>
  <path d="M 198 177 C 194 184 192 190 191 193" stroke="#7A4A28" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 211 179 C 210 186 210 191 209 194" stroke="#7A4A28" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- ─── EYE ────────────────────────────────────────────────────── -->
  <circle cx="97" cy="98" r="4.5" fill="#160C04"/>
  <circle cx="96" cy="97" r="1.8" fill="white" opacity="0.45"/>

  <!-- ─── NOSTRIL at snout tip ──────────────────────────────────── -->
  <circle cx="17" cy="150" r="2" fill="#160C04" opacity="0.5"/>

</svg>
